<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Gradiente para a folha maior (esquerda) -->
    <linearGradient id="leaf-left-grad" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#468A14" />
      <stop offset="100%" stop-color="#64A31C" />
    </linearGradient>
    <!-- Gradiente para a folha menor (direita) -->
    <linearGradient id="leaf-right-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#609F1C" />
      <stop offset="100%" stop-color="#80BD24" />
    </linearGradient>
  </defs>
  <!-- Símbolo das duas folhas verdes estilizadas (broto de palma) -->
  <g transform="translate(0.5, 0.5)">
    <!-- Folha Esquerda (Maior) -->
    <path d="M 15.5 25.5 C 10.5 22.5 5.5 16.5 5.5 11.5 C 5.5 5.5 11.5 3.5 15.5 7.5 C 18.5 10.5 17.5 19.5 15.5 25.5 Z" fill="url(#leaf-left-grad)" />
    <!-- Folha Direita (Menor) -->
    <path d="M 15.5 25.5 C 17.5 20.0 20.0 15.0 23.5 12.0 C 26.5 9.0 29.5 10.5 29.5 13.5 C 29.5 17.5 26.5 22.0 20.5 24.5 C 18.5 25.3 16.5 25.5 15.5 25.5 Z" fill="url(#leaf-right-grad)" />
  </g>
</svg>